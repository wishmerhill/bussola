name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! needs the frontend dist folder to exist at compile time.
      - run: npm ci
      - run: npm run build

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  build:
    # Release exe only on manual runs and version tags; push/PR on main run tests only.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    env:
      # Env RUSTFLAGS replaces .cargo/config.toml rustflags: keep every flag here.
      RUSTFLAGS: -C target-feature=+crt-static --remap-path-prefix=${{ github.workspace }}=.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release

      - run: npm ci

      - name: tauri build (exe only, no installer)
        run: npm run tauri build -- --no-bundle

      - uses: actions/upload-artifact@v7
        with:
          name: bussola-windows
          path: src-tauri/target/release/bussola.exe
          if-no-files-found: error
